name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Syntax check
        run: python -m compileall -q lifehub

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Leak & placeholder guard
        run: |
          if grep -RniE 'oc_[0-9a-f]{20,}|GBFPbsB2jaMpjYsxINmc8tDAngR|tblylXZVS3NmkbcU|cli_aa105d0a26b8dbe5|sk-07a17fccc2b040428bdf4f0a048d039c|29781|企鹅大王咕咕嘎|自然之宝|伊利|your-repo-url' \
            --include='*.py' --include='*.toml' --include='*.md' \
            --include='*.ps1' --include='*.vbs' --include='*.bat' \
            --include='*.yml' --include='*.yaml' .; then
            echo "::error title=LeakGuard::forbidden pattern(s) found in tracked files"
            exit 1
          fi
          echo "Leak guard passed"

      - name: CLI smoke
        run: |
          python -m lifehub.cli --help
          lifehub --help
