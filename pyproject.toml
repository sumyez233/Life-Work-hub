[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifehub"
description = "Local-first personal hub: talk to your PC from Feishu (todos / events / ledger / Bitable / files / Codex)"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
license = { text = "MIT" }
authors = [{ name = "Sumyez" }]
keywords = ["feishu", "lark", "personal-hub", "local-first", "productivity", "sqlite", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.110",
  "httpx>=0.27",
  "lark-oapi>=1.4,<2",
  "requests>=2.31",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
lifehub = "lifehub.cli:main"

[tool.setuptools]
packages = ["lifehub"]

[tool.setuptools.dynamic]
version = { attr = "lifehub.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
